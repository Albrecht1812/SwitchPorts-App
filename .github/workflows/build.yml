name: Build SwitchPorts

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Diagnose SwitchPorts Build
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Check current directory
        run: |
          echo "===== CURRENT DIRECTORY ====="
          pwd

      - name: Check repository files
        run: |
          echo "===== REPOSITORY FILES ====="
          ls -la
          echo "===== SOURCE DIRECTORY ====="
          ls -la source

      - name: Display Makefile
        run: |
          echo "===== MAKEFILE CONTENT ====="
          cat -A Makefile

      - name: Check devkitPro
        run: |
          echo "===== DEVKITPRO ====="
          echo "$DEVKITPRO"
          echo "===== SWITCH RULES ====="
          ls -la "$DEVKITPRO/libnx/switch_rules"

      - name: Diagnose Make targets
        run: |
          echo "===== MAKE DATABASE ====="
          make -pn 2>&1 | head -100 || true

      - name: Check default target
        run: |
          echo "===== DEFAULT GOAL ====="
          make --debug=v 2>&1 || true
