name: Build SwitchPorts

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Compile Nintendo Switch App
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Check SDL2 availability
        run: |
          echo "Searching for SDL2..."
          find /opt/devkitpro/portlibs/switch \
            \( -name SDL.h -o -name 'libSDL2*' \) -print

      - name: Compile SwitchPorts
        run: make

      - name: Check NRO file
        run: |
          ls -lh SwitchPorts.nro
          test -f SwitchPorts.nro

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: SwitchPorts-NRO
          path: SwitchPorts.nro
